<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ViziThink">
  <defs>
    <linearGradient id="vtm-trend" x1="13" y1="33" x2="34" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <radialGradient id="vtm-glow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop stop-color="#6ea8fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Crosshair axes (the 2x2 grid) — no outer frame -->
  <line x1="24" y1="7" x2="24" y2="41" stroke="#2a2f3a" stroke-width="1.4"/>
  <line x1="7" y1="24" x2="41" y2="24" stroke="#2a2f3a" stroke-width="1.4"/>

  <!-- Insight glow -->
  <circle cx="34" cy="14" r="12" fill="url(#vtm-glow)"/>

  <!-- Reasoning path: options plotted, rising toward the best choice (top-right) -->
  <polyline points="13,33 20,27 28,20 34,14" fill="none" stroke="url(#vtm-trend)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plotted options -->
  <circle cx="13" cy="33" r="2.4" fill="#9b8cff"/>
  <circle cx="20" cy="27" r="2.4" fill="#5fd6a6"/>
  <circle cx="28" cy="20" r="2.7" fill="#f0b86e"/>

  <!-- The decision -->
  <circle cx="34" cy="14" r="4.6" fill="#6ea8fe"/>
  <circle cx="34" cy="14" r="1.8" fill="#dbe9ff"/>
</svg>
