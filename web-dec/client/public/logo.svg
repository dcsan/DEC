<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ViziThink">
  <defs>
    <linearGradient id="vt-bg" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c2029"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="vt-trend" x1="13" y1="33" x2="34" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <radialGradient id="vt-glow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop stop-color="#6ea8fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Thinking canvas -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#vt-bg)" stroke="#2b3a55" stroke-width="1.5"/>

  <!-- Crosshair axes (the 2x2 grid) -->
  <line x1="24" y1="9" x2="24" y2="39" stroke="#2a2f3a" stroke-width="1.4"/>
  <line x1="9" y1="24" x2="39" y2="24" stroke="#2a2f3a" stroke-width="1.4"/>

  <!-- Insight glow -->
  <circle cx="34" cy="14" r="11" fill="url(#vt-glow)"/>

  <!-- Reasoning path: options plotted, rising toward the best choice (top-right) -->
  <polyline points="13,33 20,27 28,20 34,14" fill="none" stroke="url(#vt-trend)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plotted options -->
  <circle cx="13" cy="33" r="2.4" fill="#9b8cff" stroke="#0f1115" stroke-width="1"/>
  <circle cx="20" cy="27" r="2.4" fill="#5fd6a6" stroke="#0f1115" stroke-width="1"/>
  <circle cx="28" cy="20" r="2.7" fill="#f0b86e" stroke="#0f1115" stroke-width="1"/>

  <!-- The decision -->
  <circle cx="34" cy="14" r="4.4" fill="#6ea8fe" stroke="#0f1115" stroke-width="1"/>
  <circle cx="34" cy="14" r="1.7" fill="#dbe9ff"/>
</svg>
